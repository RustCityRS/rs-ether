name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  ELIXIR_VERSION: "1.18.3"
  OTP_VERSION: "27.3.3"
  # Must match the Zig version Burrito requires (see burrito's README).
  ZIG_VERSION: "0.15.2"

jobs:
  docker:
    name: docker image (ghcr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rustcityrs/rs-ether
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: native binaries (burrito)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y xz-utils p7zip-full

      - run: mix local.hex --force && mix local.rebar --force

      - run: mix deps.get

      - name: Build all targets
        env:
          MIX_ENV: prod
          BURRITO_BUILD: "1"
        run: mix release rs_ether

      - name: Checksums
        working-directory: burrito_out
        run: |
          for f in rs_ether_*; do
            case "$f" in *.sha256) continue;; esac
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            burrito_out/rs_ether_*

      - name: Upload artifacts (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: rs_ether-binaries
          path: burrito_out/rs_ether_*
